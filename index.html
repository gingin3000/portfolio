<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gina — UX &amp; Content Design</title><!-- Fallback only; the live tab title comes from CONTENT.siteTitle in the script below. -->
<link rel="stylesheet" href="design-system/design-system.css">
<style>
  /* App-specific translucent helpers (not part of the core token set) */
  :root {
    --pill-bg: rgba(255,255,255,0.6);
    --pill-border: rgba(0,0,0,0.06);
    --pill-shadow: 0 4px 24px -8px rgba(0,0,0,0.08);
    --pill-active-bg: rgba(0,0,0,0.06);
    --glass-bg: rgba(255,255,255,0.6);
    --glass-border: rgba(0,0,0,0.06);
    --glow: rgba(35,146,122,0.2);
    --glow-strong: rgba(2,77,240,0.45);
    --glow-border: rgba(35,146,122,0.3);
    --aurora-mint: rgba(87,217,186,0.22);
    --aurora-lav: rgba(169,123,239,0.16);
    --aurora-azure: rgba(70,184,255,0.15);
  }
  [data-theme="dark"] {
    --pill-bg: rgba(255,255,255,0.06);
    --pill-border: rgba(255,255,255,0.1);
    --pill-shadow: none;
    --pill-active-bg: rgba(255,255,255,0.12);
    --glass-bg: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.1);
    --glow: rgba(127,245,218,0.15);
    --glow-strong: rgba(139,173,248,0.55);
    --glow-border: rgba(127,245,218,0.3);
    --aurora-mint: rgba(127,245,218,0.22);
    --aurora-lav: rgba(192,156,255,0.18);
    --aurora-azure: rgba(70,184,255,0.16);
  }

  /* Sunrise/sunset theme change: a staggered cross-fade.
     The background (and borders/shadows) fade FIRST; the text color follows with a
     delay, so instead of both washing through mid-gray at once, the text melts into
     the darkening/lightening background and then re-emerges in its new color.
     Applied ONLY while toggling (the .theming class is added on click and removed
     after the fade), so hover interactions stay snappy the rest of the time. */
  html.theming, html.theming *, html.theming *::before, html.theming *::after {
    transition: background-color 1000ms cubic-bezier(0.45,0.05,0.55,0.95) 0ms,
                background 1000ms cubic-bezier(0.45,0.05,0.55,0.95) 0ms,
                border-color 1000ms cubic-bezier(0.45,0.05,0.55,0.95) 0ms,
                box-shadow 1000ms cubic-bezier(0.45,0.05,0.55,0.95) 0ms,
                color 1000ms cubic-bezier(0.45,0.05,0.55,0.95) 1050ms,
                fill 1000ms cubic-bezier(0.45,0.05,0.55,0.95) 1050ms !important;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-family, system-ui); }
  a { color: var(--primary-main); text-decoration: none; }
  a:hover { color: var(--primary-hover); }
  input::placeholder, textarea::placeholder { color: #6A7079; opacity: 1; }
  [data-theme="dark"] input::placeholder, [data-theme="dark"] textarea::placeholder { color: #9CA2A9; }

  .shell { min-height: 100vh; background: var(--background-default); display: flex; flex-direction: column; transition: background 0.4s ease; position: relative; overflow: hidden; }
  .aurora { position: absolute; inset: 0; pointer-events: none; }
  .blob { position: absolute; }

  .nav-wrap { display: flex; justify-content: center; padding: 28px; position: relative; z-index: 2; }
  .nav-pill { display: flex; gap: 8px; align-items: center; background: var(--pill-bg); border: 1px solid var(--pill-border); border-radius: 999px; padding: 6px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--pill-shadow); }
  .nav-item { font: var(--fw-medium) 13px var(--font-family); border-radius: 999px; padding: 8px 20px; cursor: pointer; transition: color 0.4s ease, background 0.4s ease, box-shadow 0.6s ease; user-select: none; }
  .nav-item:hover { color: var(--text-primary) !important; box-shadow: 0 0 18px -2px var(--glow); }
  .theme-btn { font-size: 18px; line-height: 1; display: flex; align-items: center; color: var(--text-secondary); border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: color 0.4s ease, box-shadow 0.6s ease; }
  .theme-btn:hover { color: var(--text-primary); box-shadow: 0 0 18px -2px var(--glow); }

  .view { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; box-sizing: border-box; position: relative; z-index: 1; }
  .view-pad { padding: 32px 56px 80px; }

  .home-view { display: flex; flex-direction: column; justify-content: center; padding: 64px 72px; }
  .eyebrow { font: var(--fw-regular) 12px var(--font-family); color: var(--text-secondary); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 20px; }
  .home-headline { font: var(--fw-semibold) 46px/1.25 var(--font-family-headings); color: var(--text-display); letter-spacing: -0.01em; text-wrap: pretty; }
  .home-cta { margin-top: 44px; display: inline-flex; gap: 12px; align-items: center; color: var(--primary-main); cursor: pointer; transition: text-shadow 0.6s ease, gap 0.6s cubic-bezier(0.22,1,0.36,1); }
  .home-cta:hover { gap: 16px; text-shadow: 0 0 16px var(--glow-strong); }

  .section-title { font: var(--fw-semibold) 32px var(--font-family-headings); color: var(--text-display); letter-spacing: -0.005em; }
  .lede { font: 400 15px/1.5 var(--font-family); color: var(--text-secondary); max-width: 560px; text-wrap: pretty; }

  .work-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .work-card { background: var(--glass-bg); border-radius: var(--radius-12); padding: 24px; cursor: pointer; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: box-shadow 0.6s ease, border-color 0.6s ease; }
  .work-card:hover { box-shadow: 0 0 0 1px var(--glow-border), 0 8px 40px -8px var(--glow); border-color: var(--glow-border); }
  .work-cover { height: 220px; border-radius: var(--radius-8); background: var(--background-default); border: 1px dashed var(--outline-strong); display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font: 400 12px/1.5 var(--font-family); color: var(--text-secondary); }
  .work-title { margin-top: 16px; font: var(--fw-semibold) 18px var(--font-family-headings); color: var(--text-display); }
  .work-line { margin-top: 4px; font: 400 13px/1.5 var(--font-family); color: var(--text-secondary); }

  .case-back { display: inline-flex; gap: 8px; align-items: center; color: var(--text-secondary); cursor: pointer; margin: 8px 0 32px; transition: color 0.4s ease, text-shadow 0.6s ease; }
  .case-back:hover { color: var(--text-primary); text-shadow: 0 0 14px var(--glow); }
  .case-title { font: var(--fw-semibold) 40px/1.2 var(--font-family-headings); color: var(--text-display); letter-spacing: -0.005em; text-wrap: pretty; }
  .case-sub { margin-top: 16px; font: 400 16px/1.6 var(--font-family); color: var(--text-secondary); text-wrap: pretty; }
  .case-hero { margin-top: 40px; height: 420px; border-radius: var(--radius-12); background: var(--surface-default); border: 1px dashed var(--outline-strong); display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font: 400 13px/1.5 var(--font-family); color: var(--text-secondary); }
  .case-facts { margin-top: 48px; display: grid; grid-template-columns: repeat(4,1fr); gap: 32px; padding: 32px 0; border-top: 1px solid var(--divider-default); border-bottom: 1px solid var(--divider-default); }
  .fact-label { font: 400 11px var(--font-family); color: var(--text-secondary); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 8px; }
  .fact-value { font: 400 14px/1.5 var(--font-family); color: var(--text-primary); }
  .case-body { display: flex; flex-direction: column; gap: 64px; margin-top: 64px; max-width: 680px; }
  .case-h { font: var(--fw-semibold) 24px var(--font-family-headings); color: var(--text-display); margin-bottom: 16px; }
  .case-p { font: 400 15px/1.7 var(--font-family); color: var(--text-primary); }
  .media { border-radius: var(--radius-8); background: var(--surface-default); border: 1px dashed var(--outline-strong); display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font: 400 12px/1.5 var(--font-family); color: var(--text-secondary); }

  .about-grid { display: grid; grid-template-columns: 320px 1fr; gap: 64px; margin-top: 24px; }
  .portrait { width: 100%; aspect-ratio: 4/5; border-radius: var(--radius-12); background: var(--surface-default); border: 1px dashed var(--outline-strong); display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; font: 400 12px/1.5 var(--font-family); color: var(--text-secondary); }
  .caption { font: 400 12px/1.5 var(--font-family); color: var(--text-disabled); }
  .chip { font: var(--fw-medium) 12px var(--font-family); color: var(--neutral-on-container); background: var(--neutral-container); padding: 5px 12px; border-radius: var(--radius-full); }

  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font: var(--fw-medium) 13px var(--font-family); color: var(--text-primary); }
  .field input, .field textarea { font: 400 15px var(--font-family); color: var(--text-primary); background: var(--surface-default); border: 1px solid var(--outline-default); border-radius: var(--radius-8); padding: 12px 16px; outline: none; box-shadow: var(--inset-shadow-field); }
  .field textarea { font: 400 15px/1.5 var(--font-family); resize: vertical; }
  .field input:focus, .field textarea:focus { border-color: var(--primary-main); }
  .send-btn { font: var(--fw-medium) var(--type-button-md-font-size) var(--font-family); letter-spacing: 0.025em; color: var(--primary-contrast-text); background: var(--primary-main); border: none; border-radius: var(--radius-full); padding: 12px 28px; cursor: pointer; transition: box-shadow 0.6s ease; }
  .send-btn:hover { box-shadow: 0 0 32px -4px var(--glow-strong); }
  .contact-actions { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .linkedin-btn { display: inline-flex; align-items: center; gap: 8px; font: var(--fw-medium) var(--type-button-md-font-size) var(--font-family); letter-spacing: 0.025em; color: var(--text-primary); background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-full); padding: 11px 24px; cursor: pointer; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: box-shadow 0.6s ease, border-color 0.6s ease; }
  .linkedin-btn:hover { color: var(--text-primary); box-shadow: 0 0 24px -6px var(--glow); border-color: var(--glow-border); }
  .linkedin-btn svg { display: block; }

  @media (max-width: 720px) {
    .home-view { padding: 48px 28px; }
    .view-pad { padding: 24px 28px 64px; }
    .home-headline { font-size: 34px; }
    .case-title { font-size: 30px; }
    .work-grid { grid-template-columns: 1fr; }
    .case-facts { grid-template-columns: 1fr 1fr; gap: 24px; }
    .about-grid { grid-template-columns: 1fr; gap: 32px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  // ═══════════════════════════════════════════════════════════════════════
  //  ✏️  YOUR WEBSITE CONTENT — this is the only block you edit to change words
  // ───────────────────────────────────────────────────────────────────────
  //  • Change the text inside the "quotes".
  //  • Keep the quotes, colons, and commas exactly where they are.
  //  • To add/remove a project, skill, fact, or case-study section: copy an
  //    existing entry (with its trailing comma) and edit it, or delete one.
  //  • You don't need to escape & < > or quotes in the text — that's automatic.
  //  Everything BELOW the "END OF CONTENT" banner is layout/logic — leave it.
  // ═══════════════════════════════════════════════════════════════════════
  var CONTENT = {

    // Text shown in the browser tab
    siteTitle: "Gina — UX & Content Design",

    // ── Top navigation ─────────────────────────────────────────────
    // "label" is what visitors see. Leave "id" alone — it wires to the pages.
    nav: [
      { id: "home",    label: "Home" },
      { id: "work",    label: "Work" },
      { id: "about",   label: "About" },
      { id: "contact", label: "Contact" }
    ],

    // ── HOME page ──────────────────────────────────────────────────
    home: {
      eyebrow:  "UX & Content Design",
      headline: "One-line positioning statement: what Gina designs, for whom, and the feeling it leaves behind.",
      ctaLabel: "View selected work"
    },

    // ── WORK page (the project gallery) ────────────────────────────
    work: {
      title: "Selected work",
      intro: "One-sentence framing for the gallery: what kinds of problems these four case studies cover.",
      // One entry per card. Add or delete an entry to change the number of cards.
      projects: [
        { title: "Project one — title",   meta: "Role · one-line description of the problem", cover: "Cover image — one key screen or artifact" },
        { title: "Project two — title",   meta: "Role · one-line description of the problem", cover: "Cover image — one key screen or artifact" },
        { title: "Project three — title", meta: "Role · one-line description of the problem", cover: "Cover image — one key screen or artifact" },
        { title: "Project four — title",  meta: "Role · one-line description of the problem", cover: "Cover image — one key screen or artifact" }
      ]
    },

    // ── CASE STUDY page (opens when a project card is clicked) ──────
    // One template serves every project. The heading is the clicked project's
    // "title" (above) with "titleSuffix" appended.
    caseStudy: {
      titleSuffix: " — full case study title, framed as the challenge",
      subtitle:    'Subtitle: one sentence stating the outcome of the project — the "so what" up front.',
      backLabel:   "All work",
      hero:        "Hero image — the final product in context, full width",
      // The four facts in the row under the hero image.
      facts: [
        { label: "Role",     value: "Your role on the project" },
        { label: "Timeline", value: "Duration and year" },
        { label: "Team",     value: "Who you worked with" },
        { label: "Platform", value: "Web, mobile, etc." }
      ],
      // Body sections, in order. "media" holds the caption(s) for grey image
      // placeholders: [] = none, one caption = one wide box, two = a side-by-side pair.
      sections: [
        { heading: "The problem",
          body: "Paragraph describing the user and business problem — evidence it was worth solving, who was affected, what was at stake.",
          media: [] },
        { heading: "Approach",
          body: "Paragraph on process: research done, constraints, how UX and content design worked together, key decisions and trade-offs.",
          media: ["Process artifact — sketches, journey map, or content model", "Iteration — before/after or wireframe-to-final"] },
        { heading: "The solution",
          body: "Paragraph walking through what shipped — the key screens or flows, and the content decisions that made them work.",
          media: ["Solution imagery — final screens, annotated if helpful"] },
        { heading: "Outcome",
          body: "Paragraph on results: metrics moved, qualitative feedback, what was learned, what came next.",
          media: [] }
      ]
    },

    // ── ABOUT page ─────────────────────────────────────────────────
    about: {
      title:           "About",
      portrait:        "Portrait photo — natural light, unposed",
      portraitCaption: "Caption: location, or a small human detail.",
      // Each string is one paragraph.
      paragraphs: [
        "I help teams bring order into chaos. By asking the right questions, providing data and design direction, I make sure we build products that work.",
        "In my current role, I collaborate with 7 product designers to support 10+ product teams as a Senior Content Designer. My job is to build bridges – between the business and its users, different teams, hierarchy levels, disciplines, products and features.",
        "My design philosophy is to build non-distracting digital experiences that just flow. I’m passionate about building technology with care, enabling its users to live better, simpler lives offline."
      ],
      skillsHeading: "Practice",
      skills: ["UX research", "Content governance", "Information architecture", "UX writing", "Systems thinking", "Stakeholder management", "Growth design"],
      toolsHeading: "Tools",
      tools: ["Figma", "Claude", "GitHub", "Jira", "Kameleoon", "Google Analytics", "Clarity"]
    },

    // ── CONTACT page ───────────────────────────────────────────────
    contact: {
      title:        "Contact",
      intro:        "One warm sentence inviting a conversation — projects, collaborations, or just to say hello.",
      ctaLabel:     "Email me",
      linkedinLabel:"Message me on",   // followed by the inline LinkedIn logo
      linkedinUrl:  "https://www.linkedin.com/in/gina-kliche-4a885896/"
    }
  };
  // ═══════════════════════════════════════════════════════════════════════
  //  ⛔  END OF CONTENT — everything below is layout & logic. No edits needed.
  // ═══════════════════════════════════════════════════════════════════════

  // ── State ─────────────────────────────────────────────────────────────
  var state = { page: "home", theme: "light", caseIdx: 0 };

  // Contact address, assembled at runtime so it isn't in the raw HTML for scrapers.
  var MAIL_USER = ["gini", "kay", "studio"].join("");
  var MAIL_DOMAIN = ["gmail", "com"].join(".");
  function contactAddress() { return MAIL_USER + String.fromCharCode(64) + MAIL_DOMAIN; }

  // Inline LinkedIn brand mark (replaces the word "LinkedIn" in the button).
  var LINKEDIN_LOGO =
    '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
      '<rect width="24" height="24" rx="4" fill="#0A66C2"></rect>' +
      '<path fill="#fff" d="M4.34 8.9h2.62V19H4.34V8.9zM5.65 4.2a1.52 1.52 0 110 3.04 1.52 1.52 0 010-3.04zM9.06 8.9h2.51v1.38h.04c.35-.66 1.2-1.36 2.48-1.36 2.65 0 3.14 1.74 3.14 4.01V19h-2.62v-4.98c0-1.19-.02-2.72-1.66-2.72-1.66 0-1.91 1.3-1.91 2.64V19H9.06V8.9z"></path>' +
    '</svg>';

  // ── Aurora blob geometry, per page (ported from blobsFor) ──────────────
  function blobsFor(page) {
    var mint = "var(--aurora-mint)";
    var lav = "var(--aurora-lav)";
    var azure = "var(--aurora-azure)";
    var d = { top: "auto", left: "auto", right: "auto", bottom: "auto" };
    function mk(o) { return Object.assign({}, d, o); }
    var configs = {
      home: [
        mk({ top: "-120px", left: "15%", w: "480px", h: "480px", r: "50%", color: mint, blur: "40px", anim: "auroraA 18s ease-in-out infinite" }),
        mk({ bottom: "-160px", right: "5%", w: "560px", h: "560px", r: "50%", color: lav, blur: "50px", anim: "auroraB 24s ease-in-out infinite" }),
        mk({ top: "20%", right: "30%", w: "380px", h: "380px", r: "50%", color: azure, blur: "45px", anim: "auroraA 30s ease-in-out infinite reverse" })
      ],
      work: [
        mk({ bottom: "-220px", left: "-10%", w: "900px", h: "420px", r: "50%", color: mint, blur: "60px", anim: "auroraB 26s ease-in-out infinite" }),
        mk({ top: "8%", right: "-140px", w: "360px", h: "540px", r: "48% 52% 55% 45%", color: lav, blur: "50px", anim: "auroraA 22s ease-in-out infinite reverse" })
      ],
      about: [
        mk({ top: "-100px", left: "-160px", w: "420px", h: "680px", r: "50%", color: azure, blur: "55px", anim: "auroraA 28s ease-in-out infinite" }),
        mk({ bottom: "-140px", left: "45%", w: "540px", h: "380px", r: "60% 40% 55% 45%", color: mint, blur: "55px", anim: "auroraB 32s ease-in-out infinite reverse" })
      ],
      contact: [
        mk({ top: "-240px", left: "32%", w: "640px", h: "640px", r: "45% 55% 50% 50%", color: lav, blur: "60px", anim: "auroraB 30s ease-in-out infinite" }),
        mk({ bottom: "-100px", left: "-90px", w: "300px", h: "300px", r: "50%", color: mint, blur: "45px", anim: "auroraA 20s ease-in-out infinite reverse" })
      ],
      case: [
        mk({ top: "-180px", right: "-150px", w: "520px", h: "520px", r: "55% 45% 50% 50%", color: azure, blur: "55px", anim: "auroraA 26s ease-in-out infinite reverse" }),
        mk({ top: "55%", left: "-180px", w: "380px", h: "380px", r: "50%", color: lav, blur: "50px", anim: "auroraB 32s ease-in-out infinite" })
      ]
    };
    return configs[page] || configs.home;
  }

  // ── Helpers ────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function auroraHTML(page) {
    return blobsFor(page).map(function (b) {
      return '<div class="blob" style="top:' + b.top + ';left:' + b.left + ';right:' + b.right +
        ';bottom:' + b.bottom + ';width:' + b.w + ';height:' + b.h + ';border-radius:' + b.r +
        ';background:radial-gradient(ellipse at center,' + b.color + ',transparent 65%)' +
        ';filter:blur(' + b.blur + ')"></div>';
    }).join("");
  }

  function navHTML() {
    var items = CONTENT.nav.map(function (p) {
      var active = state.page === p.id || (p.id === "work" && state.page === "case");
      var color = active ? "var(--text-primary)" : "var(--text-secondary)";
      var bg = active ? "var(--pill-active-bg)" : "transparent";
      return '<span class="nav-item" data-go="' + p.id + '" style="color:' + color + ';background:' + bg + '">' + esc(p.label) + '</span>';
    }).join("");
    var icon = state.theme === "light" ? "dark_mode" : "light_mode";
    return '<div class="nav-wrap"><div class="nav-pill">' + items +
      '<span class="ds-icon theme-btn" data-toggle-theme="1">' + icon + '</span></div></div>';
  }

  // ── Views ────────────────────────────────────────────────────────────
  function homeHTML() {
    var c = CONTENT.home;
    return '<div class="view home-view"><div style="max-width:680px">' +
      '<div class="eyebrow">' + esc(c.eyebrow) + '</div>' +
      '<div class="home-headline">' + esc(c.headline) + '</div>' +
      '<div class="home-cta" data-go="work">' +
        '<span style="font:var(--fw-medium) 15px var(--font-family)">' + esc(c.ctaLabel) + '</span>' +
        '<span class="ds-icon" style="font-size:18px">arrow_forward</span>' +
      '</div>' +
      '</div></div>';
  }

  function workHTML() {
    var w = CONTENT.work;
    var cards = w.projects.map(function (p, i) {
      return '<div class="work-card" data-open="' + i + '">' +
        '<div class="work-cover">' + esc(p.cover) + '</div>' +
        '<div class="work-title">' + esc(p.title) + '</div>' +
        '<div class="work-line">' + esc(p.meta) + '</div>' +
      '</div>';
    }).join("");
    return '<div class="view view-pad">' +
      '<div class="section-title" style="margin:24px 0 8px">' + esc(w.title) + '</div>' +
      '<div class="lede" style="margin-bottom:48px">' + esc(w.intro) + '</div>' +
      '<div class="work-grid">' + cards + '</div>' +
    '</div>';
  }

  function caseHTML() {
    var cs = CONTENT.caseStudy;
    var proj = CONTENT.work.projects[state.caseIdx] || CONTENT.work.projects[0];
    var facts = cs.facts.map(function (f) {
      return '<div><div class="fact-label">' + esc(f.label) + '</div><div class="fact-value">' + esc(f.value) + '</div></div>';
    }).join("");
    var sections = cs.sections.map(function (s) {
      var media = "";
      var m = s.media || [];
      if (m.length === 1) {
        media = '<div class="media" style="margin-top:24px;height:360px">' + esc(m[0]) + '</div>';
      } else if (m.length >= 2) {
        media = '<div style="margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px">' +
          m.map(function (cap) { return '<div class="media" style="height:220px">' + esc(cap) + '</div>'; }).join("") +
        '</div>';
      }
      return '<div><div class="case-h">' + esc(s.heading) + '</div><div class="case-p">' + esc(s.body) + '</div>' + media + '</div>';
    }).join("");
    var title = esc(proj.title) + esc(cs.titleSuffix);
    return '<div class="view view-pad">' +
      '<div class="case-back" data-go="work">' +
        '<span class="ds-icon" style="font-size:16px">arrow_back</span>' +
        '<span style="font:var(--fw-medium) 13px var(--font-family)">' + esc(cs.backLabel) + '</span>' +
      '</div>' +
      '<div style="max-width:680px">' +
        '<div class="case-title">' + title + '</div>' +
        '<div class="case-sub">' + esc(cs.subtitle) + '</div>' +
      '</div>' +
      '<div class="case-hero">' + esc(cs.hero) + '</div>' +
      '<div class="case-facts">' + facts + '</div>' +
      '<div class="case-body">' + sections + '</div>' +
    '</div>';
  }

  function aboutHTML() {
    var a = CONTENT.about;
    var paras = a.paragraphs.map(function (p) { return '<div>' + esc(p) + '</div>'; }).join("");
    var chips = a.skills.map(function (s) { return '<span class="chip">' + esc(s) + '</span>'; }).join("");
    var toolChips = a.tools.map(function (s) { return '<span class="chip">' + esc(s) + '</span>'; }).join("");
    return '<div class="view view-pad"><div class="about-grid">' +
      '<div style="display:flex;flex-direction:column;gap:20px">' +
        '<div class="portrait">' + esc(a.portrait) + '</div>' +
        '<div class="caption">' + esc(a.portraitCaption) + '</div>' +
      '</div>' +
      '<div style="max-width:560px">' +
        '<div class="section-title" style="margin-bottom:24px">' + esc(a.title) + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:20px;font:400 15px/1.7 var(--font-family);color:var(--text-primary)">' +
          paras +
        '</div>' +
        '<div style="margin-top:40px;border-top:1px solid var(--divider-default);padding-top:24px">' +
          '<div style="font:400 12px var(--font-family);color:var(--text-secondary);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:16px">' + esc(a.skillsHeading) + '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:14px 8px">' + chips + '</div>' +
        '</div>' +
        '<div style="margin-top:40px;border-top:1px solid var(--divider-default);padding-top:24px">' +
          '<div style="font:400 12px var(--font-family);color:var(--text-secondary);letter-spacing:0.07em;text-transform:uppercase;margin-bottom:16px">' + esc(a.toolsHeading) + '</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:14px 8px">' + toolChips + '</div>' +
        '</div>' +
      '</div>' +
    '</div></div>';
  }

  function contactHTML() {
    var c = CONTENT.contact;
    var body = '<div class="contact-actions">' +
      '<button class="send-btn" data-email="1">' + esc(c.ctaLabel) + '</button>' +
      '<a class="linkedin-btn" href="' + esc(c.linkedinUrl) + '" target="_blank" rel="noopener noreferrer" aria-label="' + esc(c.linkedinLabel) + ' LinkedIn">' +
        esc(c.linkedinLabel) + ' ' + LINKEDIN_LOGO +
      '</a>' +
    '</div>';
    return '<div class="view view-pad"><div style="max-width:520px;margin-top:24px">' +
      '<div class="section-title" style="margin-bottom:8px">' + esc(c.title) + '</div>' +
      '<div style="font:400 15px/1.5 var(--font-family);color:var(--text-secondary);margin-bottom:40px;text-wrap:pretty">' + esc(c.intro) + '</div>' +
      body +
    '</div></div>';
  }

  function currentViewHTML() {
    switch (state.page) {
      case "work": return workHTML();
      case "case": return caseHTML();
      case "about": return aboutHTML();
      case "contact": return contactHTML();
      default: return homeHTML();
    }
  }

  // ── Render ──────────────────────────────────────────────────────────
  function render() {
    var auroraOpacity = state.page === "home" ? 1 : 0.45;
    var app = document.getElementById("app");
    app.innerHTML =
      '<div class="shell">' +
        '<div class="aurora" style="opacity:' + auroraOpacity + '">' + auroraHTML(state.page) + '</div>' +
        navHTML() +
        currentViewHTML() +
      '</div>';
    wire();
  }

  // ── Event wiring (delegated per render) ──────────────────────────────
  function wire() {
    var app = document.getElementById("app");

    app.querySelectorAll("[data-go]").forEach(function (el) {
      el.addEventListener("click", function () { go(el.getAttribute("data-go")); });
    });
    app.querySelectorAll("[data-open]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.caseIdx = parseInt(el.getAttribute("data-open"), 10);
        go("case");
      });
    });
    var themeBtn = app.querySelector("[data-toggle-theme]");
    if (themeBtn) themeBtn.addEventListener("click", toggleTheme);

    var emailBtn = app.querySelector("[data-email]");
    if (emailBtn) emailBtn.addEventListener("click", openEmail);
  }

  // Opens the visitor's email app with a fresh message to the contact address.
  function openEmail() {
    window.location.href = "mailto:" + contactAddress() +
      "?subject=" + encodeURIComponent("Portfolio enquiry");
  }

  // ── Hash routing ─────────────────────────────────────────────────────
  // The URL hash is the source of truth for the current page, so links are
  // shareable, refresh keeps you in place, and the browser Back/Forward
  // buttons move between tabs. Home = no hash; a case study = "#case-<n>".
  var ROUTES = { home: 1, work: 1, about: 1, contact: 1 };

  function pageHash(page) {
    if (page === "home") return "";
    if (page === "case") return "#case-" + state.caseIdx;
    return "#" + page;
  }

  // Read the current hash and render the matching page.
  function applyHash() {
    var h = window.location.hash.replace(/^#/, "");
    var m = h.match(/^case-(\d+)$/);
    if (m && parseInt(m[1], 10) < CONTENT.work.projects.length) {
      state.caseIdx = parseInt(m[1], 10);
      state.page = "case";
    } else if (h && ROUTES[h]) {
      state.page = h;
    } else {
      state.page = "home";
    }
    render();
    window.scrollTo(0, 0);
  }

  function go(page) {
    var target = pageHash(page);
    if (window.location.hash === target) {
      applyHash(); // hash unchanged (e.g. re-click current tab) — render directly
    } else {
      window.location.hash = target; // fires "hashchange" -> applyHash
    }
  }

  window.addEventListener("hashchange", applyHash);

  var themeTimer = null;
  function applyTheme(animate) {
    var root = document.documentElement;
    if (animate) {
      root.classList.add("theming");
      if (themeTimer) window.clearTimeout(themeTimer);
      themeTimer = window.setTimeout(function () { root.classList.remove("theming"); }, 2250);
    }
    root.setAttribute("data-theme", state.theme);
    // The nav pill persists across the toggle, so update its icon in place
    // rather than re-rendering (a re-render would restart the DOM and kill the fade).
    var btn = document.querySelector(".theme-btn");
    if (btn) btn.textContent = state.theme === "light" ? "dark_mode" : "light_mode";
  }

  function toggleTheme() {
    state.theme = state.theme === "light" ? "dark" : "light";
    try { localStorage.setItem("gina-theme", state.theme); } catch (e) {}
    applyTheme(true);
  }

  // ── Init ───────────────────────────────────────────────────────────
  document.title = CONTENT.siteTitle;
  var saved = null;
  try { saved = localStorage.getItem("gina-theme"); } catch (e) {}
  state.theme = saved || "light";
  applyTheme(false); // set the theme with no animation on first load
  applyHash();       // render the page named in the URL hash (or home)
})();
</script>
</body>
</html>
